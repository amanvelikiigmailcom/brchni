name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          HUSKY: 0

      - name: Write production variables
        run: printf '%s' "$PROD_VARS" > .prod.vars
        env:
          PROD_VARS: ${{ secrets.PROD_VARS }}

      - name: Deploy
        run: bun run deploy
        env:
          CI: "true"

      - name: Remove production variables
        if: always()
        run: rm -f .prod.vars
